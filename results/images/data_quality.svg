<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" font-family="Helvetica,Arial,sans-serif"><rect width="760" height="416" fill="#fff"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Data-quality issues in the raw feed (lines; flags overlap)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">removed: duplicates, A-invoices, fees, price &lt;= 0, write-offs, reversals; C-invoices -&gt; returns; outliers flagged</text><rect x="237" y="55.6" width="407.9" height="16.9" fill="#f2cc8f"/><text x="231" y="68" font-size="10" text-anchor="end" fill="#333">missing CustomerID (all lines)</text><text x="649" y="68" font-size="9" text-anchor="start" fill="#444">135,080</text><rect x="237" y="79.8" width="396.8" height="16.9" fill="#f2cc8f"/><text x="231" y="92" font-size="10" text-anchor="end" fill="#333">guest sales lines (kept)</text><text x="638" y="92" font-size="9" text-anchor="start" fill="#444">131,387</text><rect x="237" y="103.9" width="122.6" height="16.9" fill="#f2cc8f"/><text x="231" y="116" font-size="10" text-anchor="end" fill="#333">revenue &gt; Q3 + 1.5 IQR (flag)</text><text x="364" y="116" font-size="9" text-anchor="start" fill="#444">40,611</text><rect x="237" y="128.1" width="80.7" height="16.9" fill="#f2cc8f"/><text x="231" y="140" font-size="10" text-anchor="end" fill="#333">qty &gt; Q3 + 1.5 IQR (flag)</text><text x="322" y="140" font-size="9" text-anchor="start" fill="#444">26,737</text><rect x="237" y="152.2" width="28.0" height="16.9" fill="#f2cc8f"/><text x="231" y="165" font-size="10" text-anchor="end" fill="#333">C-invoice lines (-&gt; returns)</text><text x="269" y="165" font-size="9" text-anchor="start" fill="#444">9,288</text><rect x="237" y="176.3" width="27.2" height="16.9" fill="#f2cc8f"/><text x="231" y="189" font-size="10" text-anchor="end" fill="#333">country label standardised</text><text x="268" y="189" font-size="9" text-anchor="start" fill="#444">8,991</text><rect x="237" y="200.5" width="15.9" height="16.9" fill="#f2cc8f"/><text x="231" y="213" font-size="10" text-anchor="end" fill="#333">exact duplicates (removed)</text><text x="257" y="213" font-size="9" text-anchor="start" fill="#444">5,268</text><rect x="237" y="224.6" width="8.9" height="16.9" fill="#f2cc8f"/><text x="231" y="237" font-size="10" text-anchor="end" fill="#333">postage / fees / vouchers (removed)</text><text x="250" y="237" font-size="9" text-anchor="start" fill="#444">2,950</text><rect x="237" y="248.8" width="8.2" height="16.9" fill="#f2cc8f"/><text x="231" y="261" font-size="10" text-anchor="end" fill="#333">reversed by credit note (removed)</text><text x="249" y="261" font-size="9" text-anchor="start" fill="#444">2,709</text><rect x="237" y="272.9" width="7.6" height="16.9" fill="#f2cc8f"/><text x="231" y="285" font-size="10" text-anchor="end" fill="#333">price &lt;= 0 (removed)</text><text x="249" y="285" font-size="9" text-anchor="start" fill="#444">2,517</text><rect x="237" y="297.1" width="4.4" height="16.9" fill="#f2cc8f"/><text x="231" y="310" font-size="10" text-anchor="end" fill="#333">missing description</text><text x="245" y="310" font-size="9" text-anchor="start" fill="#444">1,454</text><rect x="237" y="321.2" width="4.0" height="16.9" fill="#f2cc8f"/><text x="231" y="334" font-size="10" text-anchor="end" fill="#333">qty &lt;= 0 write-offs (removed)</text><text x="245" y="334" font-size="9" text-anchor="start" fill="#444">1,336</text><rect x="237" y="345.3" width="1.6" height="16.9" fill="#f2cc8f"/><text x="231" y="358" font-size="10" text-anchor="end" fill="#333">revenue &gt; P99.9 (flag)</text><text x="243" y="358" font-size="9" text-anchor="start" fill="#444">520</text><rect x="237" y="369.5" width="0.0" height="16.9" fill="#f2cc8f"/><text x="231" y="382" font-size="10" text-anchor="end" fill="#333">A-invoice adjustments (removed)</text><text x="241" y="382" font-size="9" text-anchor="start" fill="#444">3</text><line